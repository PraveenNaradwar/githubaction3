

name: CI/CD PIPELINE WORKFLOW

on: 
    push: 
        branches: 
            - main

jobs: 
    test-job: 
        runs-on: ubuntu-latest

        steps: 
            - name: checkout code
              uses: actions/checkout@v2

            - name: setup python version
              uses: actions/setup-python@v6
              with: 
                python-version: "3.10"

            - name: install required dependencies
              run: pip install -r requirements.txt

            - name: run test cases
              run: pytest --cov=calc --cov-report=term --cov-fail-under=80


    deploy-job: 
        runs-on: ubuntu-latest

        steps: 
            - name: print message
              run: echo 'deploy job start'

           